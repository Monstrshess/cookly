<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookly - Поиск и подбор рецептов</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_BASE = 'http://localhost:3000/api'; // Измените порт под ваш backend

    function App() {
      // Состояния поиска по названию
      const [query, setQuery] = useState('');
      const [recipeSuggestions, setRecipeSuggestions] = useState([]);

      // Состояния подбора по ингредиентам
      const [ingredientQuery, setIngredientQuery] = useState('');
      const [ingredientSuggestions, setIngredientSuggestions] = useState([]);
      const [selectedIngredients, setSelectedIngredients] = useState([]);
      const [matchedRecipes, setMatchedRecipes] = useState([]);
      const [isSearching, setIsSearching] = useState(false);

      // Состояние модалки
      const [selectedRecipeId, setSelectedRecipeId] = useState(null);
      const [recipeDetail, setRecipeDetail] = useState(null);
      const [loadingDetail, setLoadingDetail] = useState(false);

      // Debounce Поиск рецептов
      useEffect(() => {
        const timer = setTimeout(async () => {
          if (query.trim()) {
            try {
              const res = await fetch(`${API_BASE}/recipes/search?q=${encodeURIComponent(query)}`);
              const data = await res.json();
              setRecipeSuggestions(Array.isArray(data) ? data : data.object || []);
            } catch (e) { console.error(e); }
          } else { setRecipeSuggestions([]); }
        }, 300);
        return () => clearTimeout(timer);
      }, [query]);

      // Debounce Поиск ингредиентов
      useEffect(() => {
        const timer = setTimeout(async () => {
          if (ingredientQuery.trim()) {
            try {
              const res = await fetch(`${API_BASE}/ingredients/search?q=${encodeURIComponent(ingredientQuery)}`);
              const data = await res.json();
              setIngredientSuggestions(Array.isArray(data) ? data : data.object || []);
            } catch (e) { console.error(e); }
          } else { setIngredientSuggestions([]); }
        }, 300);
        return () => clearTimeout(timer);
      }, [ingredientQuery]);

      // Детали рецепта
      const openRecipe = async (id) => {
        setSelectedRecipeId(id);
        setLoadingDetail(true);
        try {
          const res = await fetch(`${API_BASE}/recipes/${id}`);
          if (res.ok) {
            const data = await res.json();
            setRecipeDetail(data);
          }
        } catch (e) { console.error(e); }
        finally { setLoadingDetail(false); }
      };

      // Подбор рецептов
      const findByIngredients = async () => {
        if (!selectedIngredients.length) return;
        setIsSearching(true);
        try {
          const res = await fetch(`${API_BASE}/recipes/searchByIngredients`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ids: selectedIngredients.map(i => i.id) })
          });
          const data = await res.json();
          setMatchedRecipes(Array.isArray(data) ? data : data.object || []);
        } catch (e) { console.error(e); }
        finally { setIsSearching(false); }
      };

      const toggleIngredient = (ing) => {
        if (selectedIngredients.some(i => i.id === ing.id)) {
          setSelectedIngredients(selectedIngredients.filter(i => i.id !== ing.id));
        } else {
          setSelectedIngredients([...selectedIngredients, ing]);
        }
      };

      return (
        <div className="min-h-screen pb-12">
          {/* Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
            <div className="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
              <h1 className="text-2xl font-bold text-orange-500 flex items-center gap-2">
                🍳 Cookly
              </h1>
            </div>
          </header>

          <main className="max-w-3xl mx-auto px-4 mt-6 space-y-6">

            {/* ФИЧА 1: ЧЕ СВАРИТЬ? */}
            <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
              <h2 className="text-xl font-bold text-slate-900 mb-1">🔥 Че сварить?</h2>
              <p className="text-sm text-slate-500 mb-4">Выберите ингредиенты в холодильнике</p>

              <div className="relative mb-3">
                <input
                  type="text"
                  placeholder="Введите ингредиент (например, сыр, яйцо...)"
                  value={ingredientQuery}
                  onChange={(e) => setIngredientQuery(e.target.value)}
                  className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500"
                />
                {ingredientSuggestions.length > 0 && (
                  <div className="absolute top-full left-0 right-0 mt-1 bg-white border rounded-xl shadow-lg max-h-48 overflow-y-auto z-20">
                    {ingredientSuggestions.map(ing => {
                      const active = selectedIngredients.some(i => i.id === ing.id);
                      return (
                        <div
                          key={ing.id}
                          onClick={() => toggleIngredient(ing)}
                          className={`px-4 py-2.5 cursor-pointer flex justify-between ${active ? 'bg-orange-50 font-semibold text-orange-600' : 'hover:bg-slate-50'}`}
                        >
                          <span>{ing.name}</span>
                          {active && <span>✓</span>}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              {/* Выбранное */}
              {selectedIngredients.length > 0 && (
                <div className="flex flex-wrap gap-2 mb-4">
                  {selectedIngredients.map(ing => (
                    <span key={ing.id} className="bg-orange-100 text-orange-800 text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1">
                      {ing.name}
                      <button onClick={() => toggleIngredient(ing)} className="ml-1 text-orange-600 font-bold">×</button>
                    </span>
                  ))}
                </div>
              )}

              <button
                onClick={findByIngredients}
                disabled={!selectedIngredients.length || isSearching}
                className="w-full py-3 bg-orange-500 hover:bg-orange-600 disabled:bg-slate-200 text-white font-bold rounded-xl transition shadow-md"
              >
                {isSearching ? 'Подбираем...' : 'Подобрать рецепты'}
              </button>

              {/* Результаты подбора */}
              {matchedRecipes.length > 0 && (
                <div className="mt-6 border-t pt-4 space-y-2">
                  <h3 className="font-semibold text-slate-700">Подходящие блюда:</h3>
                  {matchedRecipes.map(r => (
                    <div
                      key={r.id}
                      onClick={() => openRecipe(r.id)}
                      className="p-3 bg-slate-50 hover:bg-orange-50 rounded-xl cursor-pointer border flex justify-between items-center transition"
                    >
                      <div>
                        <div className="font-bold text-slate-800">{r.name}</div>
                        {r.macronutrients && (
                          <div className="text-xs text-slate-400">{r.macronutrients.calroies} ккал</div>
                        )}
                      </div>
                      <span className="text-slate-400">→</span>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* ФИЧА 2: ИСКАТЬ РЕЦЕПТЫ */}
            <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
              <h2 className="text-xl font-bold text-slate-900 mb-1">🔍 Искать рецепты</h2>
              <p className="text-sm text-slate-500 mb-4">Поиск по названию блюда</p>

              <div className="relative">
                <input
                  type="text"
                  placeholder="Название рецепта..."
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                  className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                {recipeSuggestions.length > 0 && (
                  <div className="absolute top-full left-0 right-0 mt-1 bg-white border rounded-xl shadow-lg max-h-48 overflow-y-auto z-20">
                    {recipeSuggestions.map(r => (
                      <div
                        key={r.id}
                        onClick={() => { openRecipe(r.id); setQuery(''); setRecipeSuggestions([]); }}
                        className="px-4 py-3 hover:bg-blue-50 cursor-pointer border-b last:border-0 flex justify-between"
                      >
                        <span className="font-semibold text-slate-800">{r.name}</span>
                        {r.macronutrients && <span className="text-xs text-slate-400">{r.macronutrients.calroies} ккал</span>}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>

          </main>

          {/* МОДАЛКА РЕЦЕПТА */}
          {selectedRecipeId && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 max-w-lg w-full relative shadow-2xl">
                <button
                  onClick={() => setSelectedRecipeId(null)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl"
                >
                  ✕
                </button>

                {loadingDetail ? (
                  <div className="py-12 text-center text-slate-400">Загрузка...</div>
                ) : recipeDetail ? (
                  <div>
                    <h2 className="text-2xl font-bold mb-2 text-slate-900">{recipeDetail.name}</h2>
                    <p className="text-sm text-slate-600 mb-4">{recipeDetail.description}</p>

                    {recipeDetail.macronutrients && (
                      <div className="grid grid-cols-4 gap-2 bg-orange-50 p-3 rounded-xl text-center mb-4 border border-orange-100">
                        <div><div className="text-[10px] text-orange-600 uppercase font-bold">Ккал</div><div className="font-bold text-slate-800">{recipeDetail.macronutrients.calroies}</div></div>
                        <div><div className="text-[10px] text-orange-600 uppercase font-bold">Белки</div><div className="font-bold text-slate-800">{recipeDetail.macronutrients.protein}г</div></div>
                        <div><div className="text-[10px] text-orange-600 uppercase font-bold">Жиры</div><div className="font-bold text-slate-800">{recipeDetail.macronutrients.fats}г</div></div>
                        <div><div className="text-[10px] text-orange-600 uppercase font-bold">Углев</div><div className="font-bold text-slate-800">{recipeDetail.macronutrients.carbs}г</div></div>
                      </div>
                    )}

                    <h3 className="font-bold text-slate-800 mb-2">Ингредиенты:</h3>
                    <ul className="space-y-1.5 max-h-48 overflow-y-auto">
                      {recipeDetail.ingredients?.map((ing, i) => (
                        <li key={i} className="flex justify-between bg-slate-50 px-3 py-2 rounded-lg text-sm">
                          <span>{ing.name}</span>
                          <span className="font-semibold text-slate-500">
                            {ing.amountGr}г {ing.customAmount && `(${ing.customAmount} ${ing.customUnit})`}
                          </span>
                        </li>
                      ))}
                    </ul>
                  </div>
                ) : null}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
